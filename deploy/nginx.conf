# Together Diary — Nginx reverse proxy config for the VPS.
# Copy to /etc/nginx/sites-available/together-diary, symlink into
# sites-enabled, then run `certbot --nginx` to add HTTPS.

server {
    listen 80;
    server_name your-domain.example;

    # Matches the 5MB image cap enforced in app/api/upload/route.ts.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pasted/background images, served by the SeaweedFS S3 gateway.
    # MINIO_PUBLIC_URL in .env should be set to https://your-domain.example/media
    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }
}
