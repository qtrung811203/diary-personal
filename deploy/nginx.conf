# Together Diary — Nginx reverse proxy config for the VPS.
# OPTIONAL: the primary deploy path is deploy/cloudflared-config.yml
# (Cloudflare Tunnel, no Nginx needed). Keep this only if you'd rather
# terminate TLS yourself instead of via Cloudflare.
# Copy to /etc/nginx/sites-available/together-diary, symlink into
# sites-enabled, then run `certbot --nginx` to add HTTPS.

server {
    listen 80;
    server_name diary.lmt-nqt.online;

    # app/api/upload/route.ts caps the image itself at 5MB; this is a bit
    # higher to leave room for multipart overhead so a near-5MB image
    # doesn't trip Nginx's own 413 (which the app can't turn into a clean
    # JSON error) before reaching the app's own check.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pasted/background images, served by the SeaweedFS S3 gateway.
    # MINIO_PUBLIC_URL in .env should be set to https://diary.lmt-nqt.online/media
    #
    # The upload route only accepts PNG/JPEG/GIF/WebP (never SVG, which can
    # carry <script>), but these headers are a second layer: they stop a
    # browser from executing anything served from here as script/HTML even
    # if a bad file ever got stored, which matters because this location is
    # same-origin with the app and its session cookie.
    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
}
