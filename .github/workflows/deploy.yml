name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time; a newer push waits instead of racing the older one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Route types (PageProps/LayoutProps) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only origin main
            C="docker compose -f docker-compose.prod.yml"
            $C build app
            # Migrate with the new image before swapping the running app.
            $C run --rm -T app npx prisma migrate deploy
            $C up -d app
            sleep 8
            curl -fsS -o /dev/null http://127.0.0.1:3300/login
            docker image prune -f
