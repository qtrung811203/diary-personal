services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: together_diary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: together_diary
    # The app container reaches this over the compose network (service name
    # `postgres`, internal port 5432); this host-side mapping is only for
    # tools run from outside Docker (e.g. a one-off `psql`). 127.0.0.1 only,
    # never 0.0.0.0. Host port 5433, not 5432, to stay clear of other services
    # (see README's "Ports" section for the full list this avoids).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /srv/diary-together/postgres:/var/lib/postgresql/data

  object-storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Doubles as the S3 access key/secret pair MinIO's root user already
      # is — matches MINIO_ACCESS_KEY/MINIO_SECRET_KEY in .env directly.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # Pasted/background images are fetched directly by browsers (<img src>),
    # so the S3 port must be reachable beyond localhost. Bound to 127.0.0.1
    # here and routed in through the Cloudflare Tunnel's media.lmt-nqt.online
    # ingress rule (see deploy/cloudflared-config.yml) instead of exposing it
    # directly. Host port 9010, not 9000, to stay clear of the other MinIO
    # already running on this box (mathneo-minio-1); 9011 for the console.
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - /srv/nqt-math/minio:/data

  app:
    build:
      context: .
      args:
        # Only needs to be a syntactically valid Postgres URL (see
        # Dockerfile) — the real one below is what the running container
        # actually uses.
        DATABASE_URL: "postgresql://user:password@localhost:5432/together_diary?schema=public"
    restart: unless-stopped
    depends_on:
      - postgres
      - object-storage
    environment:
      # DATABASE_URL/MINIO_ENDPOINT use the compose network's service names
      # (postgres/object-storage), not 127.0.0.1 — that's only the host-side
      # port mapping other tools (e.g. `npx prisma migrate deploy` run from
      # outside Docker) would use. Everything else comes from .env.
      DATABASE_URL: "postgresql://together_diary:${POSTGRES_PASSWORD}@postgres:5432/together_diary?schema=public"
      MINIO_ENDPOINT: "http://object-storage:9000"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
    # Cloudflare Tunnel (deploy/cloudflared-config.yml) connects here, same
    # as it would for a non-Docker PM2 deploy — only 127.0.0.1, never 0.0.0.0.
    ports:
      - "127.0.0.1:3300:3300"
